<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaBook - Muro Social</title>
  <link rel="icon" href="photos/favicon.png" type="image/png">
  <meta name="description" content="Portal exclusivo para afiliados de AquaBook. Tu rincón de expresión y conexión.">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Supabase Library Removed -->
</head>

<body>
  <!-- Pantalla de Login Obligatorio -->
  <div id="loginOverlay" class="login-overlay">
    <div class="bg-watermark"></div>
    <div class="login-card glass-header">
      <img src="photos/logo_agua.png" class="login-logo" alt="Logo AquaBook" onerror="this.style.display='none'">

      <!-- Vista de Login -->
      <div id="loginView">
        <h2>Registro de Acceso</h2>
        <p>Por favor, identifícate para acceder al Portal</p>
        <form id="loginForm">
          <div class="input-group">
            <input type="text" id="logLegajo" placeholder="Legajo" required
              oninvalid="this.setCustomValidity('Por favor ingrese su Legajo')" oninput="this.setCustomValidity('')">
          </div>
          <div class="input-group">
            <input type="password" id="logPassword" placeholder="Contraseña" required
              oninvalid="this.setCustomValidity('Por favor ingrese su Contraseña')"
              oninput="this.setCustomValidity('')">
          </div>
          <div class="login-actions">
            <button type="submit" id="btnIngresar" class="login-btn">Ingresar</button>
            <button type="button" onclick="switchLoginView('register')" class="login-btn secondary-btn">Crear
              Cuenta</button>
          </div>
        </form>
      </div>

      <!-- Vista de Registro (Oculta por defecto) -->
      <div id="registerView" class="hidden">
        <h2>Crear Cuenta</h2>
        <p>Completa tus datos para registrarte</p>
        <form id="registerForm">
          <div class="input-group">
            <input type="text" id="regNombre" placeholder="Nombre Completo" required>
          </div>
          <div class="input-group">
            <input type="text" id="regLegajo" placeholder="Legajo" required
              oninvalid="this.setCustomValidity('Por favor ingrese su Legajo')" oninput="this.setCustomValidity('')">
          </div>
          <div class="input-group">
            <input type="password" id="regPassword" placeholder="Contraseña" required
              oninvalid="this.setCustomValidity('Por favor ingrese su Contraseña')"
              oninput="this.setCustomValidity('')">
          </div>
          <div class="input-group">
            <input type="password" id="regPasswordConfirm" placeholder="Repetir Contraseña" required
              oninvalid="this.setCustomValidity('Por favor ingrese su Contraseña')"
              oninput="this.setCustomValidity('')">
          </div>
          <div class="login-actions">
            <button type="submit" class="login-btn">Registrarse</button>
            <button type="button" onclick="switchLoginView('login')" class="login-btn secondary-btn">Volver</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Barra de Usuario Superior -->
  <div id="userStatus" class="user-status-bar content-hidden">
    <div class="user-info">
      👤 <span id="loggedUserName">Usuario</span>
    </div>
    <button onclick="logout()" class="logout-btn">Cerrar Sesión 🚪</button>
  </div>

  <div id="mainContent" class="container content-hidden" style="padding-top: 0; padding-bottom: 0;">
    <!-- Banner de Bienvenida -->
    <div class="welcome-banner glass-header" style="padding: 0; overflow: hidden; border-radius: 1.5rem;">
      <img src="photos/AquaBook.png" style="width: 100%; height: auto; display: block;" alt="AquaBook Banner">
    </div>
  </div>

  <!-- Muro Social Estilo Facebook -->
  <div class="container content-hidden" style="padding-top: 0;">
    <div class="feed-card glass-header">
      <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
        Tu Rincón de Expresión:
      </h3>

      <!-- Cuadro para publicar -->
      <form id="postForm" class="post-form">
        <textarea id="postText" placeholder="¿Qué estás pensando?"></textarea>
        <div class="post-footer">
          <label class="attachment-btn" for="postImage">
            📷 Foto
            <input type="file" id="postImage" accept="image/*" capture="environment" style="display: none;">
          </label>
          <button type="submit" class="login-btn post-submit-btn">Publicar</button>
        </div>
        <div id="imagePreview" class="image-preview"></div>
      </form>

      <hr style="border: none; border-top: 1px solid var(--glass-border); margin: 2rem 0;">

      <!-- Muro con los posts -->
      <section id="postsList" class="posts-list">
        <!-- Las publicaciones aparecerán aquí -->
        <p style="color: var(--text-muted); text-align: center;">Cargando el muro...</p>
      </section>
      <span class="credits"
        style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; color: rgba(255,255,255,0.3); white-space: nowrap;">©
        por F3rXuz - 2026</span>
    </div>
  </div>


  <script src="app.js?v=4"></script>
</body>

</html>
